<link rel="stylesheet" href="css/screens/create_room.css">

<div class="status-bar" id="statusBar">Set up your room</div>

<div class="create-room-body">
  <div class="field-label">Mode</div>
  <div class="mode-toggle" id="modeToggle">
    <button class="mode-btn selected" data-mode="online" type="button">
      <div class="mode-btn-title">Online</div>
      <div class="mode-btn-sub">App picks category, compares cards</div>
    </button>
    <button class="mode-btn" data-mode="offline" type="button">
      <div class="mode-btn-title">Offline</div>
      <div class="mode-btn-sub">Players compare cards themselves; one judge declares the winner</div>
    </button>
  </div>

  <div id="opponentBlock">
    <div class="field-label">Play against</div>
    <div class="mode-toggle" id="opponentToggle">
      <button class="mode-btn selected" data-opponent="friends" type="button">
        <div class="mode-btn-title">Friends</div>
        <div class="mode-btn-sub">Share the room code</div>
      </button>
      <button class="mode-btn" data-opponent="computer" type="button">
        <div class="mode-btn-title">Computer</div>
        <div class="mode-btn-sub">1 player vs a bot</div>
      </button>
    </div>
  </div>

  <div class="field-label">Category</div>
  <div class="category-list" id="categoryList"></div>

  <div class="field-label">Advanced settings — properties in play</div>
  <div class="stat-toggle-list" id="statToggleList"></div>

  <button class="btn-candy btn-green wide-btn" id="startGameConfigBtn">CREATE ROOM &amp; GO TO LOBBY</button>
  <button class="text-link-btn" id="backBtn">← Back</button>

  <div class="error-text" id="errorText"></div>
</div>
